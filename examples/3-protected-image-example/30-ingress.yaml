apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: protected-image
  namespace: szabi
spec:
  ingressClassName: traefik
  rules:
    - host: protected.szabi.sapi.click
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: protected-image
                port:
                  number: 80
  tls:
    - hosts:
        - protected.szabi.sapi.click
